<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarnTask Admin</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#18202a}.wrap{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 14px #0001;margin-bottom:18px}.num{font-size:28px;font-weight:700}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}button,input{padding:9px;border-radius:8px;border:1px solid #ddd}button{cursor:pointer}.primary{background:#2563eb;color:#fff;border:0}.danger{background:#dc2626;color:#fff;border:0}.tabs{display:flex;gap:8px;margin:16px 0}.hidden{display:none!important}</style></head><body><div class="wrap"><div class="row"><h1>EarnTask Admin</h1><button onclick="location.href='/'">Website</button></div><div class="card"><label>Admin key <input id="key" type="password" placeholder="ADMIN_KEY"></label><button class="primary" onclick="loadAll()">Connect</button><span id="msg"></span></div><div id="app" class="hidden"><div class="grid" id="stats"></div><div class="tabs"><button onclick="show('withdrawals')">Withdrawals</button><button onclick="show('tasks')">Tasks</button><button onclick="show('users')">Users</button></div><div id="withdrawals" class="card"></div><div id="tasks" class="card hidden"></div><div id="users" class="card hidden"></div></div></div><script>let K='';const $=x=>document.getElementById(x);async function api(p,o={}){o.headers={...(o.headers||{}),'X-Admin-Key':K,'Content-Type':'application/json'};const r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function show(id){['withdrawals','tasks','users'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}async function loadAll(){K=$('key').value;try{const [s,w,t,u]=await Promise.all([api('/api/admin/stats'),api('/api/admin/withdrawals'),api('/api/admin/tasks'),api('/api/admin/users')]);$('app').classList.remove('hidden');$('stats').innerHTML=`<div class=card>Users<div class=num>${s.users}</div></div><div class=card>Tasks<div class=num>${s.tasks}</div></div><div class=card>Pending withdrawals<div class=num>${s.pendingWithdrawals}</div></div><div class=card>Wallet liability<div class=num>₹${Number(s.walletLiability).toFixed(2)}</div></div>`;$('withdrawals').innerHTML='<h2>Withdrawals</h2><table><tr><th>User</th><th>Amount</th><th>UPI</th><th>Status</th><th>Action</th></tr>'+w.withdrawals.map(x=>`<tr><td>${x.name}<br>${x.email}</td><td>₹${x.amount.toFixed(2)}</td><td>${x.destination}</td><td>${x.status}</td><td>${x.status==='pending'?`<button class=primary onclick="wd('${x.id}','approved')">Approve</button> <button class=danger onclick="wd('${x.id}','rejected')">Reject</button>`:'—'}</td></tr>`).join('')+'</table>';$('tasks').innerHTML='<h2>Tasks</h2><p><input id=tt placeholder="Task title"> <input id=tr type=number min=0 placeholder="Reward"> <button class=primary onclick=addTask()>Add</button></p><table><tr><th>Title</th><th>Reward</th><th>Active</th><th>Action</th></tr>'+t.tasks.map(x=>`<tr><td>${x.title}</td><td>₹${Number(x.reward).toFixed(2)}</td><td>${x.active}</td><td><button onclick="toggleTask('${x.id}',${!x.active})">${x.active?'Disable':'Enable'}</button></td></tr>`).join('')+'</table>';$('users').innerHTML='<h2>Users</h2><table><tr><th>Name</th><th>Email</th><th>Balance</th><th>Status</th><th>Role</th></tr>'+u.users.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>₹${Number(x.wallet_balance).toFixed(2)}</td><td>${x.status}</td><td>${x.role}</td></tr>`).join('')+'</table>';show('withdrawals');$('msg').textContent='Connected'}catch(e){$('msg').textContent=e.message}}async function wd(id,status){await api('/api/admin/withdrawals/'+id,{method:'PATCH',body:JSON.stringify({status})});loadAll()}async function addTask(){await api('/api/admin/tasks',{method:'POST',body:JSON.stringify({title:$('tt').value,reward:Number($('tr').value)})});loadAll()}async function toggleTask(id,active){await api('/api/admin/tasks/'+id,{method:'PATCH',body:JSON.stringify({active})});loadAll()}</script></body></html>
