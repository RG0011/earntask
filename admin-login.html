<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarnTask Admin Login</title><style>body{font-family:system-ui;background:#f5f7fb;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:28px;border-radius:16px;width:min(380px,90%);box-shadow:0 4px 20px #0001}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #ddd}button{background:#2563eb;color:white;border:0}.hint{font-size:13px;color:#64748b}</style></head><body><div class="box"><h2>EarnTask Admin</h2><p class="hint">Use the server-side ADMIN_KEY. Never put payment or database secrets here.</p><input id="key" type="password" placeholder="ADMIN_KEY"><button onclick="login()">Open Dashboard</button><p id="msg"></p></div><script>function login(){if(!key.value.trim())return msg.textContent='Enter ADMIN_KEY';localStorage.setItem('earntask_admin_key',key.value.trim());location.href='admin.html'}</script></body></html>
